<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#131417">
<title>BOBROV — Socle en place (étape 1)</title>
<!--
  Page de contrôle provisoire de l'étape 1 : elle prouve que la chaîne
  complète fonctionne (FastAPI + statique + config centralisée).
  Elle sera remplacée par le shell SPA complet (dashboard par tuiles,
  thèmes, WebSocket) à l'étape 7.
-->
<style>
  :root {
    --bg: #131417; --card: #1e1f26; --border: #3d4150;
    --text: #e8eaf0; --dim: #aaaebc; --cyan: #00d9ff; --green: #00e676; --red: #ff3b30;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Source Code Pro', ui-monospace, 'DejaVu Sans Mono', monospace;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  main { width: 100%; max-width: 540px; text-align: center; }
  h1 { font-size: 2rem; letter-spacing: 6px; color: var(--cyan); margin-bottom: 10px; }
  .sub { color: var(--dim); font-size: 0.82rem; margin-bottom: 28px; line-height: 1.6; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 22px; text-align: left; font-size: 0.85rem; line-height: 2;
  }
  .ok { color: var(--green); }
  .err { color: var(--red); }
  code {
    color: var(--cyan); background: rgba(0, 217, 255, 0.08);
    padding: 1px 6px; border-radius: 5px; font-family: inherit; font-size: 0.82rem;
  }
</style>
</head>
<body>
<main>
  <h1>BOBROV</h1>
  <p class="sub">Cockpit de contrôle ROV — socle étape 1<br>
     (SPA complète par tuiles à l'étape 7)</p>
  <div class="card">
    <div id="status">Interrogation de <code>/api/system/status</code>…</div>
  </div>
</main>
<script>
  var el = document.getElementById('status');
  fetch('/api/system/status')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      el.innerHTML =
        '<span class="ok">&#9679; Socle opérationnel</span><br>' +
        'Version : <code>' + d.version + '</code> — config v' + d.config_version + '<br>' +
        'Uptime : ' + d.uptime_s + ' s<br>' +
        'Liaison série prévue : <code>' + d.serial.port + '</code> @ ' + d.serial.baud + ' bauds' +
        ' <span style="color:var(--dim)">(service série : étape 3)</span>';
    })
    .catch(function () {
      el.innerHTML = '<span class="err">&#9679; API injoignable</span>';
    });
</script>
</body>
</html>
